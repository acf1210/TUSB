name: TUSBApp
options:
  bundleIdPrefix: com.opentonex
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  xcodeVersion: "16.0"
packages:
  TUSBCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  TUSBApp:
    type: application
    platform: iOS
    sources:
      - path: TUSBApp
    dependencies:
      - package: TUSBCore
        product: TUSBCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opentonex.tusb
        PRODUCT_NAME: TUSB
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TUSB
        INFOPLIST_KEY_CFBundleDevelopmentRegion: pt_BR
        INFOPLIST_KEY_NSMicrophoneUsageDescription: O afinador usa o microfone para detectar a afinação.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
  TUSBUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TUSBUITests
    dependencies:
      - target: TUSBApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opentonex.tusb.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TUSBApp:
    build:
      targets:
        TUSBApp: all
        TUSBUITests: [test]
    test:
      targets:
        - TUSBUITests
